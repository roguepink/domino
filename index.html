<script>DOMINO.Game.boot();</script>

<script>
  // LINE の中で開いたときだけ、1回だけ案内する(LINE の中は画面が小さく、ホーム画面にも入れられない)
  (function () {
    var seenKey = 'domino-line-tip', seen = false;
    try { seen = localStorage.getItem(seenKey) === '1'; } catch (e) {}
    var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
    if (!/\bLine\//i.test(navigator.userAgent) || standalone || seen) return;
    var bar = document.createElement('div');
    bar.className = 'line-tip';
    bar.textContent = 'LINEの中だと画面が小さめです。右下の「…」(または右上の︙)から「ブラウザで開く」を選ぶと、大きく遊べて、ホーム画面にも入れられます。';
    var x = document.createElement('button'); x.type = 'button'; x.setAttribute('aria-label', 'とじる'); x.textContent = '×';
    x.addEventListener('click', function () { try { localStorage.setItem(seenKey, '1'); } catch (e) {} if (bar.parentNode) bar.parentNode.removeChild(bar); });
    bar.appendChild(x);
    addEventListener('load', function () {
      document.body.appendChild(bar);
      setTimeout(function () { if (bar.parentNode) bar.parentNode.removeChild(bar); }, 6000);   // 6秒で 消す(左の操作の じゃまをしない)
    });
  })();

  // ホーム画面に入れられる(アプリのように開く)ための登録。file:// や 登録できない所では 何もしない
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && location.hostname !== '127.0.0.1') {
    addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
<script>
  // はじめの画面(Google Play 風: インストール / このまま遊ぶ)。install.js が出す。ホーム画面から開いたときは出ない
  window.INSTALL_GATE = {
    id: 'domino', name: 'ドミノ ラッシュ', icon: 'icon-192.png', color: '#ff7a2f',
    tagline: 'ドミノで にげきる アクション',

    points: ['操作は 2つだけ。左で 左右、右で ジャンプ', '10の ワールド、100の ステージ。ワールドごとに 新しい しかけ', 'ゴールのあとは 空から リプレイ。自分の ドミノが ぜんぶ 倒れる'],
    shots: ['shots/1.jpg', 'shots/2.jpg', 'shots/3.jpg', 'shots/4.jpg'], badges: ['無料', '広告なし', '登録なし'],
    playLabel: '▶ このまま遊ぶ',
    onPlay: function () { try { if (DOMINO.Audio && DOMINO.Audio.unlock) DOMINO.Audio.unlock(); } catch (e) {} }
  };
</script>
